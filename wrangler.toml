name = "mi-vitae"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Static Assets configuration (SPA Mode)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "production"
APP_URL = "https://mivitae.wearesamod.com"

# Bindings for Cloudflare R2 (Optional Storage)
# [[r2_buckets]]
# binding = "AVATARS_BUCKET"
# bucket_name = "mi-vitae-assets"
